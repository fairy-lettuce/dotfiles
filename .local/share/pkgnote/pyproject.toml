[project]
name = "pkgnote"
version = "0.1.0"
description = "パッケージの導入理由・カテゴリ・マシンごとの要否を KDL で管理する個人用ツール"
readme = "README.md"
authors = [
    { name = "Chisa Tanaka", email = "chisa.ltc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ckdl>=1.0",
]

[project.scripts]
pkgnote = "pkgnote:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
