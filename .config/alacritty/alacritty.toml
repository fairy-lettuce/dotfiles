[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/colors.toml"]

[window]
opacity = 0.85
padding.x = 10
padding.y = 10

[font]
size = 11

[font.bold]
family = "Maple Syrup MJ"
style = "Bold"

[font.bold_italic]
family = "Maple Syrup MJ"
style = "Bold Italic"

[font.italic]
family = "Maple Syrup MJ"
style = "Italic"

[font.normal]
family = "Maple Syrup MJ"
style = "Regular"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
