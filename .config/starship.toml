# Generated by matugen
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'shakimofu'
add_newline = false

# powerline-style prompt migrated from powerline
# left: hostname > user > cwd   right: git branch, exit status
format = """
$hostname\
[](fg:blue bg:cyan)\
$username\
[](fg:cyan bg:green)\
$directory\
[](fg:green) """

right_format = """$git_branch$status"""

[palettes.shakimofu]
background = "#201811"
cyan = "#94d9c5"
blue = "#86b6e0"
green = "#b6d673"
orange = "#f3ab7f"
red = "#fb8969"


[hostname]
ssh_only = false
format = '[ $hostname ]($style)'
style = 'fg:background bg:blue'

[username]
show_always = true
format = '[ $user ]($style)'
style_user = 'fg:background bg:cyan'
style_root = 'fg:background bg:red bold'

[directory]
format = '[ $path ]($style)'
style = 'fg:background bg:green'
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ' '
format = '[](fg:orange)[ $symbol$branch ]($style)'
style = 'fg:background bg:orange'

[status]
disabled = false
format = '[](fg:red)[ $status ]($style)'
style = 'fg:background bg:red'
