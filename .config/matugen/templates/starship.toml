# Generated by matugen
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'shakimofu'
add_newline = false

# powerline-style prompt migrated from powerline
# left: hostname > user > cwd   right: git branch, exit status
format = """
$hostname\
[](fg:blue bg:cyan)\
$username\
[](fg:cyan bg:green)\
$directory\
[](fg:green) """

right_format = """$git_branch$status"""

[palettes.shakimofu]
<* if {{ is_dark_mode }} *>
background = "{{ theme.background.dark.hex }}"
cyan = "{{ theme.cyan.dark.hex }}"
blue = "{{ theme.blue.dark.hex }}"
green = "{{ theme.green.dark.hex }}"
orange = "{{ theme.orange.dark.hex }}"
red = "{{ theme.red.dark.hex }}"
<* else *>
background = "{{ theme.background.light.hex }}"
cyan = "{{ theme.cyan.light.hex }}"
blue = "{{ theme.blue.light.hex }}"
green = "{{ theme.green.light.hex }}"
orange = "{{ theme.orange.light.hex }}"
red = "{{ theme.red.light.hex }}"
<* endif *>

[hostname]
ssh_only = false
format = '[ $hostname ]($style)'
style = 'fg:background bg:blue'

[username]
show_always = true
format = '[ $user ]($style)'
style_user = 'fg:background bg:cyan'
style_root = 'fg:background bg:red bold'

[directory]
format = '[ $path ]($style)'
style = 'fg:background bg:green'
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ' '
format = '[](fg:orange)[ $symbol$branch ]($style)'
style = 'fg:background bg:orange'

[status]
disabled = false
format = '[](fg:red)[ $status ]($style)'
style = 'fg:background bg:red'
