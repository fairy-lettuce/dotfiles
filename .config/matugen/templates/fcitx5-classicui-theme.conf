[Metadata]
Name=Shakimofu
Version=1
Author=matugen
Description=Shakimofu theme generated by matugen
ScaleWithDPI=True

[InputPanel]
NormalColor=<* if {{ is_dark_mode }} *><* if {{ flip_mode.fcitx5 }} *>{{ theme.foreground.light.hex }}<* else *>{{ theme.foreground.dark.hex }}<* endif *><* else *><* if {{ flip_mode.fcitx5 }} *>{{ theme.foreground.dark.hex }}<* else *>{{ theme.foreground.light.hex }}<* endif *><* endif *>
HighlightColor=#ffffff
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Image=panel.png
Color=<* if {{ is_dark_mode }} *><* if {{ flip_mode.fcitx5 }} *>{{ theme.background.light.hex }}<* else *>{{ theme.background.dark.hex }}<* endif *><* else *><* if {{ flip_mode.fcitx5 }} *>{{ theme.background.dark.hex }}<* else *>{{ theme.background.light.hex }}<* endif *><* endif *>
BorderColor=<* if {{ is_dark_mode }} *><* if {{ flip_mode.fcitx5 }} *>{{ theme.orange.light.hex }}<* else *>{{ theme.orange.dark.hex }}<* endif *><* else *><* if {{ flip_mode.fcitx5 }} *>{{ theme.orange.dark.hex }}<* else *>{{ theme.orange.light.hex }}<* endif *><* endif *>
BorderWidth=2

[InputPanel/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[InputPanel/Highlight]
Color=<* if {{ is_dark_mode }} *><* if {{ flip_mode.fcitx5 }} *>{{ theme.dynamic_secondary.light.hex }}<* else *>{{ theme.dynamic_secondary.dark.hex }}<* endif *><* else *><* if {{ flip_mode.fcitx5 }} *>{{ theme.dynamic_secondary.dark.hex }}<* else *>{{ theme.dynamic_secondary.light.hex }}<* endif *><* endif *>

[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.png

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.png

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu/Background]
Image=panel.png
Color=<* if {{ is_dark_mode }} *><* if {{ flip_mode.fcitx5 }} *>{{ theme.background.light.hex }}<* else *>{{ theme.background.dark.hex }}<* endif *><* else *><* if {{ flip_mode.fcitx5 }} *>{{ theme.background.dark.hex }}<* else *>{{ theme.background.light.hex }}<* endif *><* endif *>
BorderColor=<* if {{ is_dark_mode }} *><* if {{ flip_mode.fcitx5 }} *>{{ theme.orange.light.hex }}<* else *>{{ theme.orange.dark.hex }}<* endif *><* else *><* if {{ flip_mode.fcitx5 }} *>{{ theme.orange.dark.hex }}<* else *>{{ theme.orange.light.hex }}<* endif *><* endif *>
BorderWidth=2

[Menu/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/Highlight]
Color=<* if {{ is_dark_mode }} *><* if {{ flip_mode.fcitx5 }} *>{{ theme.dynamic_secondary.light.hex }}<* else *>{{ theme.dynamic_secondary.dark.hex }}<* endif *><* else *><* if {{ flip_mode.fcitx5 }} *>{{ theme.dynamic_secondary.dark.hex }}<* else *>{{ theme.dynamic_secondary.light.hex }}<* endif *><* endif *>

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#c0c0c0

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[AccentColorField]
0=Input Panel Border
1=Input Panel Highlight Candidate Background
2=Input Panel Highlight
3=Menu Border
4=Menu Separator
5=Menu Selected Item Background
