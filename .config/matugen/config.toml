[config]
version_check = false

expr_prefix = "{{"
expr_postfix = "}}"

block_prefix = "<*"
block_postfix = "*>"

import_json_files = [
	"./extra_config.json",
	"./themes/shakimofu.json",
	"./themes/dynamic.json",
]

[templates.waybar-colors]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
# post_hook = "killall -SIGUSR2 waybar"

[templates.alacritty-colors]
input_path = "~/.config/matugen/templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/themes/colors.toml"

[templates.mako]
input_path = "~/.config/matugen/templates/mako-config"
output_path = "~/.config/mako/config"
post_hook = "makoctl reload"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel-colors.ini"
output_path = "~/.config/fuzzel/colors.ini"

[templates.fcitx5-classicui-theme]
input_path = "~/.config/matugen/templates/fcitx5-classicui-theme.conf"
output_path = "~/.local/share/fcitx5/themes/shakimofu/theme.conf"
post_hook = "~/.local/bin/generate-fcitx5-panel.py ~/.local/share/fcitx5/themes/shakimofu && busctl --user call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui"

[templates.swaylock]
input_path = "~/.config/matugen/templates/swaylock-config"
output_path = "~/.config/swaylock/config"

[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout-colors.css"
output_path = "~/.config/wlogout/style.css"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.gtk-mode]
input_path = "~/.config/matugen/templates/gtk-mode.txt"
output_path = "~/.config/matugen/generated/gtk-mode.txt"
post_hook = "~/.local/bin/sync-color-scheme.sh"

[templates.folder-color]
input_path = "~/.config/matugen/templates/folder-color.txt"
output_path = "~/.config/matugen/generated/folder-color.hex"
post_hook = "~/.local/bin/update-folder-icons.sh"

[templates.zellij]
input_path = "~/.config/matugen/templates/zellij-theme.kdl"
output_path = "~/.config/zellij/themes/shakimofu.kdl"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

[templates.helix]
input_path = "~/.config/matugen/templates/helix-theme.toml"
output_path = "~/.config/helix/themes/shakimofu.toml"
