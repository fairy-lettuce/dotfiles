[Service]
ExecStart=
ExecStart=/home/mei/.local/bin/niri --session
# Workaround: logind session activation race condition causes mouse to not work on startup.
# Polls until the session is active (up to 3s) instead of sleeping a fixed duration.
ExecStartPre=/bin/sh -c 'i=0; until [ "$(loginctl show-session "$XDG_SESSION_ID" --property=Active --value 2>/dev/null)" = "yes" ] || [ $i -ge 60 ]; do sleep 0.05; i=$((i+1)); done'
